# Reference Compose stack for LupiraContactApi.
# One .NET 10 service over one Postgres, no filesystem state:
#   lupira-contact-api — REST at root; LAN-only /mcp (agent tools), /internal (service resolve),
#                        and /dav-backend (the seam the LupiraDavApi gateway consumes).
#
# Every host, port, and identity-provider URL below is an OVERRIDABLE SAMPLE wired to a ${VAR:-default}
# env var — the defaults are illustrative, not required. Set them for your own environment.
services:
  lupira-contact-api:
    image: danbro96/lupira-contact-api:${IMAGE_TAG:-latest}
    container_name: lupira-contact-api
    environment:
      # Postgres — the Marten event store + documents (schema `contact`).
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=lupira_contact;Username=lupira_contact_user;Password=${LUPIRA_CONTACT_DB_PASSWORD:?required}"

      # REST auth — OIDC (JWT). The service only validates tokens (issuer + audience); no client secret
      # lives here. Any OIDC provider works — the default is just a sample issuer URL.
      Auth__Oidc__Authority: ${AUTH_AUTHORITY:-https://auth.lupira.com/application/o/lupira-contact/}
      Auth__Oidc__Audience: ${AUTH_AUDIENCE:-lupira-contact}

      # /dav-backend auth — a valid token for this API additionally minted by the DAV gateway's
      # client-credentials identity (azp). LAN-only surface; not routed through the tunnel.
      DavGateway__ClientId: ${DAV_GATEWAY_CLIENT_ID:-lupira-dav-svc}

      # /mcp, /internal, /dav-backend are LAN-only — keep them off the public internet.

      # OTEL — optional OTLP export (http/protobuf; 5-min metric cadence). Unset endpoint = silent no-op.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_METRIC_EXPORT_INTERVAL: ${OTEL_METRIC_EXPORT_INTERVAL:-300000}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-deployment.environment=prod}
    ports:
      - "${HOST_PORT:-42080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/readyz || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - default
      - medelynas_data         # Postgres over LAN
      - medelynas_telemetry    # OTel collector
networks:
  default:
    driver: bridge
  medelynas_data:
    external: true
    name: medelynas_data
  medelynas_telemetry:
    external: true
    name: medelynas_telemetry
